/* ============================================================
   1. TOKENS
   ============================================================ */
:root{
  --night:        #07070B;
  --night-2:      #0D0D14;
  --night-3:      #14141F;
  --lime:         #C8FF2E;
  --lime-dim:     #9BC91F;
  --purple:       #7B2FF7;
  --purple-deep:  #34107A;
  --fg:           #FAFAFA;
  --fg-mute:      #8E8E9C;
  --fg-faint:     #55555F;

  /* 過渡：列舉屬性，不用 all（避免全域 style recalculation） */
  --t-smooth: .3s cubic-bezier(.4,0,.2,1);
  --t-bounce: .4s cubic-bezier(.34,1.56,.64,1);

  --display: 'Noto Sans TC', system-ui, sans-serif;   /* 中文展示字 900 */
  --numeric: 'Anton', 'Noto Sans TC', sans-serif;     /* 數字專用 */
  --body:    'Noto Sans TC', system-ui, sans-serif;
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{ margin:0; padding:0; }

body{
  background:var(--night);
  color:var(--fg);
  font-family:var(--body);
  font-weight:400;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* 斜紋疊層：repeating-linear-gradient，零圖片、Retina 銳利、跟著主色變 */
.stripes{
  position:absolute; inset:0; pointer-events:none;
  background-image:repeating-linear-gradient(
    135deg,
    rgba(200,255,46,.05) 0px, rgba(200,255,46,.05) 1px,
    transparent 1px, transparent 20px
  );
}

/* 通用工具 */
.eyebrow{
  font-size:.6875rem; font-weight:700;
  letter-spacing:.28em; text-transform:uppercase;
  color:var(--fg-mute);
  display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
}
.eyebrow .rule{
  display:inline-block; width:2.5rem; height:2px;
  background:var(--lime); flex:none;
}
.lime{ color:var(--lime); }
.glow-lime{ text-shadow:0 0 24px rgba(200,255,46,.45); }

/* ---------- 星幣飄浮（軌道環新增元素） ---------- */
.coin-layer{ position:absolute; inset:0; pointer-events:none; }
.coin{
  position:absolute;
  background-repeat:no-repeat; background-position:center; background-size:contain;
  filter:drop-shadow(0 0 10px rgba(255,198,64,.5));
  animation:coin-drift var(--dur,7s) ease-in-out infinite;
  animation-delay:var(--dl,0s);
}
@keyframes coin-drift{
  0%,100%{ transform:translateY(0) rotate(var(--rot,0deg)); opacity:.55; }
  50%    { transform:translateY(-20px) rotate(calc(var(--rot,0deg) + 9deg)); opacity:1; }
}
.c1{ left:8%;  top:47%; width:clamp(30px,4.4vw,54px); aspect-ratio:1/.97; background-image:var(--img-coinA); --dur:7s;   --dl:-1s;   --rot:-8deg; }
.c2{ left:86%; top:53%; width:clamp(26px,3.8vw,46px); aspect-ratio:1/1.08; background-image:var(--img-coinB); --dur:8.5s; --dl:-3s;   --rot:12deg; }
.c3{ left:25%; top:21%; width:clamp(20px,2.9vw,34px); aspect-ratio:1/1.02; background-image:var(--img-coinC); --dur:6.5s; --dl:-4.5s; --rot:-16deg; }
.c4{ left:73%; top:78%; width:clamp(24px,3.4vw,42px); aspect-ratio:1/1;    background-image:var(--img-coinD); --dur:9s;   --dl:-2s;   --rot:6deg; }
.c5{ left:52%; top:12%; width:clamp(18px,2.4vw,28px); aspect-ratio:1/.97;  background-image:var(--img-coinA); --dur:7.5s; --dl:-5.5s; --rot:20deg; }
.c6{ left:40%; top:87%; width:clamp(22px,3.1vw,38px); aspect-ratio:1/1.08; background-image:var(--img-coinB); --dur:8s;   --dl:-6.5s; --rot:-11deg; }

/* ---------- 進場序列（載入後逐項升起） ---------- */
@keyframes rise{ from{ opacity:0; transform:translateY(22px); } to{ opacity:1; transform:none; } }
.rise{
  animation:rise .75s cubic-bezier(.22,1,.36,1) both;
  animation-delay:calc(var(--i,0) * 90ms + 140ms);
}
@keyframes orbit-in{ from{ opacity:0; transform:translate(-50%,-50%) scale(.86); } }
.orbit{ animation:orbit-in 1.6s cubic-bezier(.22,1,.36,1) both; }


/* ---------- 入選門檻標記塊（與次要小灰字視覺分離） ---------- */
.gate{
  display:flex; align-items:center; gap:.5rem;
  margin:0 0 .75rem;
  padding:.625rem .875rem;
  background:rgba(200,255,46,.09);
  border:1px solid rgba(200,255,46,.34);
  border-left:3px solid var(--lime);
  border-radius:3px;
  font-size:.875rem; font-weight:700; color:var(--fg);
  max-width:520px;
}
.gate svg{ flex:none; }
.gate b{ color:var(--lime); font-weight:900; font-family:var(--numeric);
  font-size:1.0625rem; letter-spacing:.02em; padding:0 .1em; }
.empty-gate{
  margin-top:.25rem; font-size:.875rem; font-weight:700; color:var(--lime);
}
.void-lead{
  margin:0 0 .875rem; font-size:1rem; font-weight:700; color:var(--fg);
}
.void-lead b{ color:var(--lime); font-family:var(--numeric);
  font-size:1.125rem; letter-spacing:.02em; padding:0 .1em; }

/* ---------- 空狀態（尚未查詢） ---------- */
.empty{
  display:flex; flex-direction:column; align-items:center; gap:1.125rem;
  padding:clamp(2.5rem,8vw,4rem) 1rem;
  text-align:center;
}
.empty-star{
  position:relative;
  width:clamp(76px,18vw,112px); aspect-ratio:102/106;
  background:var(--img-star) center/contain no-repeat;
  filter:drop-shadow(0 0 18px rgba(140,190,255,.5));
  animation:star-float 6s ease-in-out infinite;
}
.empty-star::before{
  content:''; position:absolute; z-index:-1;
  inset:-45%;
  background:radial-gradient(circle, rgba(160,200,255,.3) 0%, transparent 62%);
  animation:halo 4s ease-in-out infinite;
}
@keyframes star-float{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-12px) rotate(3deg); } }
@keyframes halo{ 0%,100%{ opacity:.45; transform:scale(1); } 50%{ opacity:.85; transform:scale(1.12); } }
.empty-text{ margin:0; color:var(--fg-mute); font-size:.9375rem; }
.empty-text b{ display:block; color:var(--fg); font-weight:700; font-family:var(--display);
  font-size:1.0625rem; margin-bottom:.25rem; }

/* ---------- 獎項區塊：星等 + 星幣 + 迸發 ---------- */
.prize-head{ display:flex; align-items:center; justify-content:space-between; gap:1rem; }
.tier{ display:flex; align-items:center; gap:.3125rem; }
.tier-star{
  width:19px; aspect-ratio:102/106;
  background:var(--img-star) center/contain no-repeat;
  filter:grayscale(1) brightness(.42);
  opacity:.5;
  transition:filter var(--t-smooth), opacity var(--t-smooth);
}
.tier-star.on{ filter:drop-shadow(0 0 7px rgba(150,195,255,.75)); opacity:1; }
.tier.is-lit .tier-star.on{
  animation:star-pop .55s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay:calc(var(--i,0) * 110ms);
}
@keyframes star-pop{ from{ transform:scale(.2) rotate(-40deg); opacity:0; } to{ transform:none; opacity:1; } }

.coin-ico{
  display:inline-block; vertical-align:-.15em;
  width:1.15em; height:1.15em; margin-right:.3em;
  background:var(--img-coinFront) center/contain no-repeat;
  filter:drop-shadow(0 0 6px rgba(255,198,64,.55));
}

/* 獎金揭曉時的星星迸發 */
.bs{
  position:absolute; left:8%; top:58%;
  width:15px; aspect-ratio:102/106;
  background:var(--img-star) center/contain no-repeat;
  opacity:0; pointer-events:none;
}
.is-burst .bs{ animation:burst 1s cubic-bezier(.22,1,.36,1) both; animation-delay:var(--dl,0s); }
@keyframes burst{
  0%  { opacity:0; transform:translate(0,0) scale(.3); }
  35% { opacity:1; }
  100%{ opacity:0; transform:translate(var(--tx),var(--ty)) scale(1.15) rotate(var(--tr,25deg)); }
}
.bs1{ --tx:-26px; --ty:-52px; --tr:-30deg; --dl:.05s; }
.bs2{ --tx: 42px; --ty:-64px; --tr: 40deg; --dl:.16s; left:26%; }
.bs3{ --tx: 96px; --ty:-38px; --tr:-18deg; --dl:.10s; left:44%; }
.bs4{ --tx:-14px; --ty: 40px; --tr: 34deg; --dl:.24s; }
.bs5{ --tx: 70px; --ty: 46px; --tr:-26deg; --dl:.19s; left:38%; }
.bs6{ --tx:132px; --ty: 12px; --tr: 22deg; --dl:.30s; left:56%; }

/* ============================================================
   2. HEADER
   ============================================================ */
.site-header{
  position:fixed; top:0; left:0; right:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem;
  padding:1.125rem clamp(1.25rem,5vw,3.5rem);
  background:transparent;
  transition:background-color var(--t-smooth), border-color var(--t-smooth);
  border-bottom:1px solid transparent;
}
/* 捲動後才上底色 — 由 IntersectionObserver sentinel 切換，非 scroll listener */
.site-header.is-stuck{
  background:rgba(7,7,11,.88);
  border-bottom-color:rgba(255,255,255,.07);
  backdrop-filter:blur(10px);
}
.brand{ display:flex; align-items:center; gap:.625rem; min-width:0; }
.brand-mark{ flex:none; }
.brand-text{
  font-family:var(--display); font-weight:900;
  font-size:.9375rem; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.period-badge{
  flex:none;
  font-size:.6875rem; font-weight:700; letter-spacing:.12em;
  padding:.3125rem .625rem;
  color:var(--lime);
  border:1px solid rgba(200,255,46,.3);
  background:rgba(200,255,46,.06);
  border-radius:2px;
}

/* ============================================================
   3. HERO（純 CSS/SVG 背景 — 暫時性，日後替換為圖片或動態）
   ============================================================ */
.hero{
  position:relative; overflow:hidden;
  min-height:100svh;
  display:flex; flex-direction:column; justify-content:center;
  padding:7rem clamp(1.25rem,5vw,3.5rem) 4rem;
}

/* 光斑：radial-gradient 取代 blur(140px)，效能成本接近零 */
.hero::before{
  content:''; position:absolute; z-index:0;
  width:80vw; height:80vw; max-width:900px; max-height:900px;
  top:-20%; right:-15%;
  background:radial-gradient(circle,
    rgba(123,47,247,.34) 0%, rgba(123,47,247,.12) 38%, transparent 68%);
  pointer-events:none;
}
.hero::after{
  content:''; position:absolute; z-index:0;
  width:70vw; height:70vw; max-width:760px; max-height:760px;
  bottom:-25%; left:-10%;
  background:radial-gradient(circle,
    rgba(200,255,46,.16) 0%, rgba(200,255,46,.05) 40%, transparent 68%);
  pointer-events:none;
}

/* 軌道環：SVG 橢圓 + 漸層描邊，極慢旋轉（90s） */
.orbit{
  position:absolute; z-index:1;
  top:50%; left:62%;
  width:min(120vw,1250px); aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  opacity:.85; pointer-events:none;
}
.orbit svg{ width:100%; height:100%; display:block; }
.orbit-spin{ transform-origin:400px 400px; animation:orbit-rotate 90s linear infinite; }
.orbit-spin-rev{ transform-origin:400px 400px; animation:orbit-rotate 130s linear infinite reverse; }
@keyframes orbit-rotate{ to{ transform:rotate(360deg); } }

.spark{ animation:spark-drift 6s ease-in-out infinite; }
.spark:nth-of-type(2n){ animation-duration:8s; animation-delay:-2s; }
.spark:nth-of-type(3n){ animation-duration:7s; animation-delay:-4s; }
@keyframes spark-drift{
  0%,100%{ transform:translateY(0); opacity:.35; }
  50%    { transform:translateY(-14px); opacity:.9; }
}

.hero-inner{ position:relative; z-index:2; max-width:min(100%,640px); }

.hero-title{
  font-family:var(--display); font-weight:900;
  margin:1.25rem 0 0;
  line-height:.92;
  letter-spacing:-.01em;
}
.hero-title .l1{
  display:block;
  font-size:clamp(2.25rem,8.5vw,4.25rem);
  color:var(--fg);
}
.hero-title .l2{
  display:block;
  font-size:clamp(3rem,12vw,6rem);
  color:var(--lime);
  text-shadow:0 0 40px rgba(200,255,46,.35);
  transform:scaleX(.96);
  transform-origin:left center;
}
.hero-sub{
  margin:1.5rem 0 0;
  max-width:none;
  font-size:1rem; color:var(--fg-mute);
  line-height:1.75;
}
/* 三行各自成塊：不論螢幕寬度都不會在句中折行 */
.hero-sub span{ display:block; }
.hero-sub strong{ color:var(--fg); font-weight:700; }

/* ============================================================
   4. 查詢表單
   ============================================================ */
.query{ position:relative; z-index:2; margin-top:2.5rem; max-width:520px; }
.query-row{ display:flex; gap:.625rem; align-items:stretch; }

.field{
  flex:1 1 auto; min-width:0;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.14);
  border-radius:3px;
  padding:.9375rem 1.0625rem;
  color:var(--fg);
  font-family:var(--body); font-size:1rem; font-weight:500;
  transition:border-color var(--t-smooth), background-color var(--t-smooth), box-shadow var(--t-smooth);
}
.field::placeholder{ color:var(--fg-faint); font-weight:400; }
.field:hover{ border-color:rgba(200,255,46,.4); }
.field:focus{
  outline:none;
  border-color:var(--lime);
  background:rgba(200,255,46,.05);
  box-shadow:0 0 0 3px rgba(200,255,46,.13);
}
.field.is-invalid{ border-color:#FF6B6B; box-shadow:0 0 0 3px rgba(255,107,107,.14); }

.btn{
  flex:none;
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  padding:.9375rem 1.625rem;
  border:none; border-radius:3px;
  background:var(--lime); color:#0A0A00;
  font-family:var(--body); font-size:.9375rem; font-weight:900;
  letter-spacing:.04em; cursor:pointer;
  transition:background-color var(--t-smooth), transform var(--t-bounce), box-shadow var(--t-smooth);
}
.btn:hover:not(:disabled){
  background:#D9FF5C;
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(200,255,46,.28);
}
.btn:active:not(:disabled){ transform:translateY(0); }
.btn:disabled{ opacity:.55; cursor:not-allowed; }
.btn:focus-visible,.field:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; }

.spinner{
  width:15px; height:15px; flex:none;
  border:2px solid rgba(10,10,0,.28);
  border-top-color:#0A0A00;
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.hint{
  margin:.75rem 0 0;
  font-size:.8125rem; color:var(--fg-faint);
  min-height:1.25rem;
}
.hint.is-error{ color:#FF8A8A; }

/* ============================================================
   5. 結果區
   ============================================================ */
.result-wrap{
  position:relative;
  padding:0 clamp(1.25rem,5vw,3.5rem) clamp(4rem,10vw,7rem);
}
.result-inner{
  max-width:640px;
  scroll-margin-top:5.5rem;   /* 自動捲動時避開 fixed header */
}

/* 跳動計數的數字鎖等寬，避免字寬變化造成版面左右抖動 */
.score-val,.prize-num,.track-cap .num{
  font-variant-numeric:tabular-nums;
  display:inline-block;
  text-align:right;
}

/* IntersectionObserver 進場：will-change 只在動畫期間掛上，不常駐 */
.reveal{
  opacity:0; transform:translateY(24px);
  transition:opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);
}
.reveal.is-in{ opacity:1; transform:none; }
.reveal.is-animating{ will-change:opacity, transform; }

.card{
  position:relative; overflow:hidden;
  background:linear-gradient(155deg, var(--night-2) 0%, var(--night-3) 100%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:4px;
  padding:clamp(1.5rem,5vw,2.25rem);
}
.card-lime{ border-color:rgba(200,255,46,.3); box-shadow:0 0 48px rgba(200,255,46,.09); }
.card-void{ border-style:dashed; border-color:rgba(255,255,255,.16); }

.card-top{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:1rem; flex-wrap:wrap;
  position:relative; z-index:1;
}
.who-label{
  font-size:.6875rem; font-weight:700; letter-spacing:.24em;
  text-transform:uppercase; color:var(--fg-faint);
}
.who-name{
  font-family:var(--display); font-weight:900;
  font-size:clamp(1.375rem,5vw,1.875rem);
  margin:.25rem 0 0; line-height:1.2;
  word-break:break-all;
}
.guild{
  font-size:.8125rem; color:var(--fg-mute); margin:.375rem 0 0;
}
.guild span{ color:var(--lime); font-weight:700; }


/* 分隔線：虛線用 repeating-linear-gradient，非 border-dashed */
.tear{
  height:1px; margin:1.5rem 0;
  background:repeating-linear-gradient(
    to right,
    rgba(250,250,250,.34) 0px, rgba(250,250,250,.34) 5px,
    transparent 5px, transparent 11px
  );
  position:relative; z-index:1;
}

/* 活絡度區 — 可獨立移除（若確認數值與遊戲內不一致） */
.score-block{ position:relative; z-index:1; }
.score-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:1rem;
}
.score-label{
  font-size:.6875rem; font-weight:700; letter-spacing:.24em;
  text-transform:uppercase; color:var(--fg-mute);
}
.score-val{
  font-family:var(--numeric);
  font-size:clamp(1.75rem,6vw,2.375rem);
  line-height:1; color:var(--fg);
  letter-spacing:.01em;
}
.track{
  position:relative; overflow:hidden;
  margin-top:.75rem; height:9px; border-radius:2px;
  background:rgba(255,255,255,.07);
}
.track::after{
  content:''; position:absolute; inset:0;
  background-image:repeating-linear-gradient(
    135deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px,
    transparent 1px, transparent 7px);
}
.fill{
  position:relative; z-index:1; height:100%; width:0;
  border-radius:2px;
  background:linear-gradient(90deg, var(--lime-dim), var(--lime));
  box-shadow:0 0 16px rgba(200,255,46,.6);
  transition:width 1.1s cubic-bezier(.22,1,.36,1);
}
.track-cap{
  display:flex; justify-content:space-between;
  margin-top:.5rem;
  font-size:.6875rem; color:var(--fg-faint);
}
.track-cap .num{ font-family:var(--numeric); letter-spacing:.05em; }

/* 獎金 — 全頁視覺重心 */
.prize-block{
  position:relative; z-index:1;
  margin-top:1.75rem; padding-top:1.75rem;
  border-top:1px solid rgba(255,255,255,.08);
}
.prize-label{
  font-size:.6875rem; font-weight:700; letter-spacing:.24em;
  text-transform:uppercase; color:var(--fg-mute);
}
.prize-row{ display:flex; align-items:baseline; gap:.625rem; margin-top:.375rem; flex-wrap:wrap; }
.prize-num{
  font-family:var(--numeric);
  font-size:clamp(3rem,14vw,5rem);
  line-height:.9; color:var(--lime);
  text-shadow:0 0 44px rgba(200,255,46,.42);
  letter-spacing:.005em;
}
.prize-unit{
  font-family:var(--display); font-weight:900;
  font-size:1.125rem; color:var(--lime);
  padding-bottom:.375rem;
}

.note{
  position:relative; z-index:1;
  margin-top:1.5rem; padding:.875rem 1rem;
  background:rgba(123,47,247,.14);
  border-left:2px solid var(--purple);
  border-radius:0 3px 3px 0;
  font-size:.875rem; color:#D8C8FF;
}
.note b{ color:var(--fg); font-weight:700; display:block; font-size:.6875rem;
  letter-spacing:.2em; text-transform:uppercase; margin-bottom:.25rem; }

/* 查無結果 */
.void-title{
  font-family:var(--display); font-weight:900;
  font-size:clamp(1.25rem,4.5vw,1.625rem);
  margin:0 0 .75rem;
}
.void-body{ margin:0; font-size:.9375rem; color:var(--fg-mute); }
.void-body li{ margin:.375rem 0; }
.void-body ul{ margin:.75rem 0 0; padding-left:1.125rem; }

/* 骨架 */
.skel{
  background:linear-gradient(90deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.11) 50%, rgba(255,255,255,.05) 100%);
  background-size:200% 100%;
  animation:shimmer 1.4s ease-in-out infinite;
  border-radius:3px;
}
@keyframes shimmer{ to{ background-position:-200% 0; } }
.skel-a{ height:1.75rem; width:55%; }
.skel-b{ height:.75rem; width:35%; margin-top:.75rem; }
.skel-c{ height:9px; width:100%; margin-top:2rem; }
.skel-d{ height:3.5rem; width:65%; margin-top:2rem; }

/* ============================================================
   6. FOOTER
   ============================================================ */
.site-footer{
  position:relative;
  border-top:1px solid rgba(255,255,255,.07);
  padding:2.25rem clamp(1.25rem,5vw,3.5rem);
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem; flex-wrap:wrap;
}
.foot-note{ font-size:.75rem; color:var(--fg-faint); }

/* ============================================================
   7. 無障礙：尊重減少動態偏好（參考站缺少這段）
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
  .reveal{ opacity:1; transform:none; }
  html{ scroll-behavior:auto !important; }
  .coin,.empty-star,.empty-star::before{ animation:none !important; }
  .bs{ display:none !important; }
}

@media (max-width:600px){
  .query-row{ flex-direction:column; }
  .btn{ width:100%; padding:1rem; }
  .orbit{ left:50%; top:38%; opacity:.6; }
}
</style>
</head>
<body>

<!-- header 黏底切換用的 sentinel（IntersectionObserver，不用 scroll listener） -->
<div id="sentinel" style="position:absolute;top:0;height:64px;width:1px;"></div>

<header class="site-header" id="header">
  <div class="brand">
    <svg class="brand-mark" width="26" height="30" viewBox="0 0 26 30" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">

      <path d="M13 9v12M8.5 12.4l4.5-3.4 4.5 3.4" stroke="#C8FF2E" stroke-width="1.6" stroke-linecap="round"/>
    </svg>

  </div>
  <span class="period-badge" id="periodBadge">08.10 — 08.16</span>
</header>

<main>
  <section class="hero">
    <div class="stripes"></div>

    <!-- 軌道環：暫時性主視覺，日後替換為你提供的圖片或動態 -->
    <div class="orbit" aria-hidden="true">
      <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#C8FF2E" stop-opacity="0"/>

          <linearGradient id="ringB" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#7B2FF7" stop-opacity="0"/>
            <stop offset="45%" stop-color="#7B2FF7" stop-opacity=".7"/>
            <stop offset="100%" stop-color="#C8FF2E" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="ringC" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%"  stop-color="#C8FF2E" stop-opacity="0"/>
            <stop offset="50%" stop-color="#C8FF2E" stop-opacity=".55"/>
            <stop offset="100%" stop-color="#C8FF2E" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <g class="orbit-spin">
          <ellipse cx="400" cy="400" rx="360" ry="132" fill="none" stroke="url(#ringA)" stroke-width="2.5"/>
          <ellipse cx="400" cy="400" rx="292" ry="107" fill="none" stroke="url(#ringB)" stroke-width="4"/>
          <ellipse cx="400" cy="400" rx="214" ry="78"  fill="none" stroke="url(#ringC)" stroke-width="2"/>
        </g>
        <g class="orbit-spin-rev">
          <ellipse cx="400" cy="400" rx="330" ry="121" fill="none" stroke="url(#ringB)" stroke-width="1.4"/>
          <ellipse cx="400" cy="400" rx="150" ry="55"  fill="none" stroke="url(#ringA)" stroke-width="3"/>
        </g>

        <g>
          <rect class="spark" x="150" y="250" width="7" height="7" fill="#C8FF2E" opacity=".6" transform="rotate(24 153 253)"/>
          <rect class="spark" x="620" y="300" width="5" height="9" fill="#7B2FF7" opacity=".7" transform="rotate(-18 622 304)"/>
          <rect class="spark" x="530" y="196" width="6" height="6" fill="#C8FF2E" opacity=".5" transform="rotate(40 533 199)"/>
          <rect class="spark" x="255" y="540" width="8" height="5" fill="#7B2FF7" opacity=".6"/>

          <rect class="spark" x="112" y="430" width="6" height="8" fill="#7B2FF7" opacity=".5" transform="rotate(12 115 434)"/>
          <circle class="spark" cx="470" cy="596" r="2.5" fill="#C8FF2E" opacity=".7"/>

        </g>
      </svg>

      <!-- 星幣飄浮：與碎片同一套 drift 手法，速度與相位各異 -->
      <div class="coin-layer">
        <span class="coin c1"></span><span class="coin c2"></span><span class="coin c3"></span>
        <span class="coin c4"></span><span class="coin c5"></span><span class="coin c6"></span>
      </div>
    </div>

    <div class="hero-inner">
      <p class="eyebrow rise" style="--i:0"><span class="rule"></span><span id="periodLine">2026 活絡度衝榜 · 第 20260810-0816 期</span></p>
      <h1 class="hero-title">
        <span class="l1 rise" style="--i:1">公會活絡度</span>

    <div class="query rise" style="--i:4">
      <p class="gate" id="gateNote">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8FF2E"
             stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/>

</main>

<footer class="site-footer">

    <span class="brand-text" style="font-size:.8125rem;">公會活絡度衝榜福利</span>
  </div>

<script>
/* ============================================================
   名單資料（PBKDF2-SHA256 哈希內嵌）
   - 鍵 = base64(PBKDF2(正規化暱稱, SALT, 200000次, 128bit))
   - 值 = [活絡度, 獎金代碼, 公會索引, 大小寫還原遮罩, 備註]
   - 不含任何暱稱明碼；順序已隨機打亂，鍵序不代表排名
   - 換期請用 build-list.html 重新產出，並同時更換 SALT
   ============================================================ */
const CONFIG = {
  SALT:        '29d9508fdd073c5d83d19f7030f0d8b1',
  ITER:        200000,
  PERIOD:      '20260810-0816',
  PERIOD_TEXT: '08.10 — 08.16',
  MAX_SCORE:   3452,
  MIN_SCORE:   300,   // 入選門檻，由轉檔工具自動取名單最低分
  GUILDS:      ["小小妍", "小小高本尊", "小小商會", "我是TK"],
  PRIZES:      [10000, 20000, 40000]
};

const PERIOD_MAX = CONFIG.MAX_SCORE;

/* 正規化：與 Excel「查詢用暱稱」欄位邏輯完全一致 */
function normalize(s){
  return String(s).normalize('NFKC').replace(/\u3000/g,' ').trim().toLowerCase();
}

/* 大小寫還原：依遮罩把指定索引轉回大寫，payload 內不存暱稱明碼 */
function restoreCase(norm, m){
  if(!m) return norm;
  const a = [...norm];
  for(const i of m){ if(a[i]) a[i] = a[i].toUpperCase(); }
  return a.join('');
}

const _enc = new TextEncoder();
async function digest(key){
  const k = await crypto.subtle.importKey('raw', _enc.encode(key), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt:_enc.encode(CONFIG.SALT), iterations:CONFIG.ITER, hash:'SHA-256' }, k, 128);
  let s = ''; const b = new Uint8Array(bits);
  for(let i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}

/* 查詢：在瀏覽器內完成，不對外發送任何請求
   開頭符號的暱稱在建檔時已建立別名鍵，故僅需一次運算 */
async function lookup(raw){
  const n = normalize(raw);
  const rec = WINNERS[await digest(n)];
  if(!rec) return null;
  return {
    nick:  restoreCase(n, rec[3]),
    guild: CONFIG.GUILDS[rec[2]],
    score: rec[0],
    prize: CONFIG.PRIZES[rec[1]],
    note:  rec[4] || ''
  };
}

/* ============================================================
   數字跳動計數
   - 先寫入最終值量出寬度並鎖住 min-width，再從 0 開始跑
     （這一步是避免版面左右抖動的關鍵）
   - ease-out 快進慢出
   - 減少動態偏好開啟時直接顯示最終值
   ============================================================ */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function countTo(el, target, dur, suffix){
  if(!el) return;
  suffix = suffix || '';
  el.textContent = target.toLocaleString() + suffix;
  el.style.minWidth = el.getBoundingClientRect().width + 'px';

  if(REDUCED) return;

  el.textContent = '0' + suffix;
  const t0 = performance.now();
  function step(now){
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);           // easeOutCubic
    el.textContent = Math.round(target * eased).toLocaleString() + suffix;
    if(p < 1){ requestAnimationFrame(step); }
    else { el.textContent = target.toLocaleString() + suffix; }
  }
  requestAnimationFrame(step);
}

/* 查詢後自動捲到結果區（送出瞬間就捲，不等結果） */
function scrollToResult(){
  document.getElementById('result').scrollIntoView({
    behavior: REDUCED ? 'auto' : 'smooth',
    block: 'start'
  });
}

const $nick = document.getElementById('nick');
const $go   = document.getElementById('go');
const $hint = document.getElementById('hint');
const $res  = document.getElementById('result');
let busy = false;

function setHint(msg, isErr){
  $hint.textContent = msg;
  $hint.classList.toggle('is-error', !!isErr);
}

function mount(html){
  $res.innerHTML = html;
  const el = $res.firstElementChild;
  if(!el) return;
  el.classList.add('is-animating');
  requestAnimationFrame(()=> requestAnimationFrame(()=> el.classList.add('is-in')));
  el.addEventListener('transitionend', ()=> el.classList.remove('is-animating'), {once:true});
}

function skeleton(){
  mount(`<div class="card reveal">
    <div class="skel skel-a"></div>
    <div class="skel skel-b"></div>
    <div class="skel skel-c"></div>
    <div class="skel skel-d"></div>
  </div>`);
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderFound(r){
  const pct = Math.max(3, Math.min(100, Math.round(r.score / PERIOD_MAX * 100)));
  const scoreBlock = SHOW_SCORE ? `
    <div class="tear"></div>
    <div class="score-block">
      <div class="score-head">
        <span class="score-label">本期活絡度</span>
        <span class="score-val" id="cScore">0</span>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="track-cap">
        <span>本期最高 <span class="num" id="cMax">0</span></span>
        <span class="num" id="cPct">0%</span>
      </div>
    </div>` : '';

  /* 星等：由獎金反推 1–3 顆，不顯示任何門檻數字 */
  const tier = r.prize >= 40000 ? 3 : r.prize >= 20000 ? 2 : 1;
  const tierMarkup = SHOW_TIER_STARS
    ? `<span class="tier" id="tierRow" title="星等 ${tier}">` +
      [0,1,2].map(i => `<span class="tier-star${i < tier ? ' on' : ''}" style="--i:${i}"></span>`).join('') +
      `</span>`
    : '';

  const noteBlock = r.note ? `
    <div class="note"><b>備註</b>${esc(r.note)}</div>` : '';

  mount(`<div class="card card-lime reveal">
    <div class="stripes"></div>
    <div class="card-top">
      <div>
        <div class="who-label">獲獎名單確認</div>
        <h2 class="who-name">${esc(r.nick)}</h2>
        <p class="guild">公會長 <span>${esc(r.guild)}</span></p>
      </div>
    </div>
    ${scoreBlock}
    <div class="prize-block" id="prizeBlock">
      <div class="prize-head">
        <span class="prize-label">星幣獎金</span>
        ${tierMarkup}
      </div>
      <div class="prize-row">
        <span class="prize-num" id="cPrize">0</span>
        <span class="prize-unit"><span class="coin-ico" aria-hidden="true"></span>星幣</span>
      </div>
      <span class="bs bs1"></span><span class="bs bs2"></span><span class="bs bs3"></span>
      <span class="bs bs4"></span><span class="bs bs5"></span><span class="bs bs6"></span>
    </div>
    ${noteBlock}
  </div>`);

  /* 第一段（0 → 1.1s）：進度條填充 + 活絡度 + 百分比 + 分母同時跳動 */
  const S1 = 1100;
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    const f = document.getElementById('fill');
    if(f) f.style.width = pct + '%';
    if(SHOW_SCORE){
      countTo(document.getElementById('cScore'), r.score,   S1);
      countTo(document.getElementById('cMax'),   PERIOD_MAX, S1);
      countTo(document.getElementById('cPct'),   pct,        S1, '%');
    }
  }));

  /* 第二段：第一段結束後獎金才跳，1.3s 跑完 */
  const delay = SHOW_SCORE ? S1 + 180 : 200;
  setTimeout(()=>{
    countTo(document.getElementById('cPrize'), r.prize, 1300);
    const tr = document.getElementById('tierRow');
    if(tr) tr.classList.add('is-lit');
    const pb = document.getElementById('prizeBlock');
    if(pb && !REDUCED) pb.classList.add('is-burst');
  }, REDUCED ? 0 : delay);
}

function renderVoid(raw){
  mount(`<div class="card card-void reveal">
    <h2 class="void-title">名單中查無「${esc(raw)}」</h2>
    <p class="void-lead">本期活絡度未滿 <b>${CONFIG.MIN_SCORE}</b>，未列入名單。</p>
    <div class="void-body">
      <p>若你確認本期活絡度已滿 ${CONFIG.MIN_SCORE}，請以遊戲內顯示的暱稱原樣重新輸入（含符號、數字、大小寫）。</p>
    </div>
  </div>`);
}

function renderError(){
  mount(`<div class="card card-void reveal">
    <h2 class="void-title">查詢暫時無法完成</h2>
    <div class="void-body"><p>頁面載入不完整，請重新整理後再試一次。若持續發生，請聯繫你的公會長。</p></div>
  </div>`);
}

function run(){
  if(busy) return;
  const raw = $nick.value;
  if(!normalize(raw)){
    $nick.classList.add('is-invalid');
    setHint('請先輸入你的遊戲暱稱。', true);
    $nick.focus();
    setTimeout(()=> $nick.classList.remove('is-invalid'), 1600);
    return;
  }

  busy = true;
  $go.disabled = true;
  $go.innerHTML = '<span class="spinner"></span>查詢中';
  setHint('正在比對名單…');
  skeleton();

  $nick.blur();          // 手機收起鍵盤，否則結果卡片只剩一小條
  scrollToResult();      // 送出瞬間就捲，讓使用者看到骨架載入

  (async ()=>{
    try{
      const hit = await lookup(raw);
      if(hit){
        renderFound(hit);
        setHint('查詢完成。獎金以官方公告名單為準。');
      }else{
        renderVoid(raw.trim());
        setHint('查無資料，請確認暱稱拼寫。', true);
      }
    }catch(e){
      renderError();
      setHint('查詢無法完成，請重新整理頁面後再試。', true);
    }finally{
      busy = false;
      $go.disabled = false;
      $go.textContent = '查詢獎金';
    }
  })();
}

/* 空狀態：尚未查詢時的畫面，捲到才淡入 */
function renderEmpty(){
  $res.innerHTML = `<div class="empty reveal" id="emptyState">
    <span class="empty-star" aria-hidden="true"></span>
    <p class="empty-text"><b>還沒有查詢紀錄</b>在上方輸入你的遊戲暱稱，查詢本期星幣獎金。
      <span class="empty-gate">本期活絡度滿 ${CONFIG.MIN_SCORE} 才會列入名單</span></p>
  </div>`;
  const el = document.getElementById('emptyState');
  new IntersectionObserver((es,ob)=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('is-in'); ob.unobserve(e.target); } });
  }, {threshold:.15}).observe(el);
}
renderEmpty();

/* 期別文字由 CONFIG 帶入，換期只需改 CONFIG */
document.getElementById('periodBadge').textContent = CONFIG.PERIOD_TEXT;
document.getElementById('periodLine').textContent  = '2026 活絡度衝榜 · 第 ' + CONFIG.PERIOD + ' 期';
document.querySelector('#gateNote span').innerHTML =
  '本期活絡度滿 <b>' + CONFIG.MIN_SCORE + '</b> 才會列入名單';

$go.addEventListener('click', run);
$nick.addEventListener('keydown', e => { if(e.key === 'Enter') run(); });

/* header 黏底：IntersectionObserver 觀察頂部 sentinel，全站零 scroll listener */
const header = document.getElementById('header');
new IntersectionObserver(([e]) => {
  header.classList.toggle('is-stuck', !e.isIntersecting);
}, {threshold:0}).observe(document.getElementById('sentinel'));
</script>
</body>
</html>
